<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>KREAVITY WORKS - Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Script ini menangkap URL error (contoh: /talent-syams)
      // Lalu melemparnya kembali ke index.html dengan query param ?p=/talent-syams
      // App.jsx nanti yang akan menangkap param 'p' ini.
      
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1 + pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
