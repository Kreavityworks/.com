<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Kreavity Works | Redirecting...</title>
    <script type="text/javascript">
      // --- KREAVITYWORKS ROUTING RECOVERY SYSTEM ---
      // Script ini bertugas mengubah 404 Error menjadi Parameter URL
      // Contoh: /talent-syams => /?p=/talent-syams
      
      var l = window.location;
      
      // Ambil path lengkap (misal: /talent-syams atau /project/neon-chaos)
      var path = l.pathname;
      var query = l.search;
      var hash = l.hash;

      // Redirect ke root index.html dengan parameter 'p'
      // replace() digunakan agar history browser tidak penuh dengan link error
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?p=' + encodeURIComponent(path) + 
        (query ? '&q=' + encodeURIComponent(query) : '') +
        hash
      );
    </script>
  </head>
  <body>
    </body>
</html>
